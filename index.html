<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory & Order Management Dashboard</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f4f7f6; padding: 30px; color: #333; }
        h1 { margin-bottom: 20px; color: #1e293b; }
        .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h2 { margin-bottom: 15px; font-size: 1.2rem; color: #0f172a; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background-color: #f8fafc; font-weight: 600; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.85rem; font-weight: bold; }
        .in-stock { background: #dcfce7; color: #15803d; }
        .low-stock { background: #fee2e2; color: #b91c1c; }
        .status-completed { background: #e0f2fe; color: #0369a1; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.9rem; }
        select, input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; }
        button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #1d4ed8; }
        button:disabled { background: #94a3b8; cursor: not-allowed; }
        #message { margin-top: 15px; padding: 10px; border-radius: 6px; display: none; font-size: 0.9rem; }
        .success { background: #dcfce7; color: #15803d; }
        .error { background: #fee2e2; color: #b91c1c; }
    </style>
</head>
<body>

    <h1>📦 Inventory & Order Management System</h1>

    <div class="grid">
        <!-- Products View -->
        <div class="card">
            <h2>Current Inventory</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Product Name</th>
                        <th>SKU</th>
                        <th>Price</th>
                        <th>Stock</th>
                    </tr>
                </thead>
                <tbody id="product-list">
                    <tr><td colspan="5">Loading inventory...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- Place Order Form -->
        <div class="card">
            <h2>Place New Order</h2>
            <form id="order-form">
                <div class="form-group">
                    <label for="customer">Customer ID</label>
                    <select id="customer" required>
                        <option value="1">Alex Johnson (ID: 1)</option>
                        <option value="2">Sam Wilson (ID: 2)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="product">Select Product</label>
                    <select id="product" required></select>
                </div>

                <div class="form-group">
                    <label for="quantity">Quantity</label>
                    <input type="number" id="quantity" min="1" value="1" required>
                </div>

                <button type="submit" id="submit-btn">Submit Order (ACID Transaction)</button>
            </form>
            <div id="message"></div>
        </div>
    </div>

    <!-- Order History View -->
    <div class="card">
        <h2>Recent Order Logs</h2>
        <table>
            <thead>
                <tr>
                    <th>Order ID</th>
                    <th>Customer Name</th>
                    <th>Total Amount</th>
                    <th>Status</th>
                    <th>Timestamp</th>
                </tr>
            </thead>
            <tbody id="order-list">
                <tr><td colspan="5">Loading orders...</td></tr>
            </tbody>
        </table>
    </div>

    <script src="app.js"></script>
</body>
</html>
